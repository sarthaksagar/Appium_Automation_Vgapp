# ===================================================================
# VGCares Mobile Automation Configuration — Physical Android Device
# ===================================================================

# Platform & Driver
platformName=Android
automationName=UiAutomator2
platformVersion=13

# Physical Device Settings (auto = dynamically detects connected USB device via ADB)
udid=auto
deviceName=Real_Android_Device

# Target Application Package & Activity
appPackage=com.vg.vgcaresglobal.qa
appActivity=com.vg.vgcaresglobal.MainActivity

# Server & Session
appiumServerUrl=http://127.0.0.1:4723/
noReset=true
fullReset=false

# ── Timeouts (seconds) ──────────────────────────────────────────────
# Reduced from 120/180 → significantly speeds up session creation
# on a warm device where UIAutomator2 server is already installed.
explicitWait=10
driverInstallTimeout=30
driverLaunchTimeout=30
newCommandTimeout=60
