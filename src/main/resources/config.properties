# ===================================================================
# VG Cares Mobile Automation Configuration — Physical Android Device
# ===================================================================

# Platform & Driver
platformName=Android
automationName=UiAutomator2
udid=auto
deviceName=Real_Android_Device

# Target Application Package & Activity
appPackage=com.vg.vgcaresglobal.qa
appActivity=com.vg.vgcaresglobal.MainActivity

# Server & Session
appiumServerUrl=http://127.0.0.1:4723
noReset=true
fullReset=false

# Execution Mode: 'standard' (fast regression) or 'learning' (1000ms demonstration delay)
execution.mode=standard
action.delay.ms=1000
explicit.wait.seconds=20
polling.interval.ms=250

# Driver Timeouts (seconds)
explicitWait=20
appiumHealthTimeout=5
adbTimeout=10
driverConnectTimeout=10
driverReadTimeout=180
driverInstallTimeout=60
driverLaunchTimeout=60
uiautomator2IdleTimeoutMillis=250
appWaitTimeout=20
newCommandTimeout=300
captureScreenshots=true

# Non-secret QA Domain Defaults (NEVER commit real emails or passwords here)
# Provide QA_PATIENT_EMAIL / QA_PATIENT_PASSWORD and QA_DOCTOR_EMAIL / QA_DOCTOR_PASSWORD
# via OS environment variables or an untracked local .env file (see .env.example).
QA_RESET_EMAIL=qa-reset@example.invalid
QA_SIGNUP_EMAIL_DOMAIN=example.invalid
